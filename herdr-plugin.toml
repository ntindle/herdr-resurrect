id = "ntindle.herdr-resurrect"
name = "herdr-resurrect"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "tmux-resurrect for herdr: snapshot the whole herd (workspaces, tabs, panes, cwd, running programs, agents) and bring it back after a crash or reboot."
platforms = ["linux", "macos", "windows"]

# --- Actions -----------------------------------------------------------------
# Save a durable, versioned snapshot of the current session to disk.
[[actions]]
id = "save"
title = "Resurrect: save snapshot"
contexts = ["workspace"]
command = ["node", "bin/save.js"]

# Rebuild / rehydrate the session from the most recent snapshot.
[[actions]]
id = "restore"
title = "Resurrect: restore last snapshot"
contexts = ["workspace"]
command = ["node", "bin/restore.js"]

# Show what restore WOULD do, without touching anything.
[[actions]]
id = "restore-preview"
title = "Resurrect: preview restore (dry run)"
contexts = ["workspace"]
command = ["node", "bin/restore.js", "--dry-run"]

# List saved snapshots.
[[actions]]
id = "snapshots"
title = "Resurrect: list snapshots"
contexts = ["workspace"]
command = ["node", "bin/list.js"]

# --- Named spaces ------------------------------------------------------------
# Save THIS workspace as a named, reusable "space", and open a saved space as a
# brand-new workspace. Both use an overlay pane for the interactive bit (a name
# prompt / an fzf picker), so they're macOS/Linux only, like any fzf UI.

# Prompt for a name and save the current workspace.
[[actions]]
id = "save-space"
title = "Resurrect: save this space as…"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "save-space.sh"]

# Fuzzy-pick a saved space and open it as a new workspace.
[[actions]]
id = "open-space"
title = "Resurrect: open saved space…"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "open-space.sh"]

# Fuzzy-pick a saved space and delete it (with confirmation).
[[actions]]
id = "delete-space"
title = "Resurrect: delete saved space…"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "delete-space.sh"]

# --- Autosave ----------------------------------------------------------------
# A long-lived pane that snapshots on a timer (tmux-continuum style).
# Open it once and leave it running; interval is HERDR_RESURRECT_INTERVAL seconds.
[[panes]]
id = "autosave"
title = "resurrect autosave"
command = ["node", "bin/autosave.js"]
placement = "split"

# Interactive overlays for the named-spaces actions above. These get a real TTY
# (unlike actions, which the server runs headless), so the name prompt and the
# fzf picker work here.
[[panes]]
id = "save-space-ui"
title = "Save space"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/save-space-ui.sh\""]

[[panes]]
id = "open-space-ui"
title = "Open space"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/open-space-ui.sh\""]

[[panes]]
id = "delete-space-ui"
title = "Delete space"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/delete-space-ui.sh\""]

# --- Startup hook: opt-in auto-restore (herdr >= 0.7.5) ----------------------
# Runs once, after herdr has restored the session and its API socket is ready —
# exactly the "server ready" trigger auto-restore needs. The hook may refuse the
# snapshot outright when it no longer matches the restored session (minAgreement
# in settings.json). It also fires on live handoff (in-place server upgrade);
# fill-only rehydrate makes that a no-op (every pane is busy, nothing is
# created, focus stays put when nothing ran). Enable via autoRestore in
# settings.json (off by default).
[[startup]]
command = ["node", "bin/on-startup.js"]

# --- Event hooks: debounced autosave ------------------------------------------
# on-event.js snapshots on every shape change (<= 1 write / 20s). It stands down
# while bin/on-startup.js holds the restore-in-progress marker (see lib/gate.js).
[[events]]
on = "workspace.created"
command = ["node", "bin/on-event.js"]

[[events]]
on = "workspace.closed"
command = ["node", "bin/on-event.js"]

[[events]]
on = "pane.created"
command = ["node", "bin/on-event.js"]

[[events]]
on = "pane.closed"
command = ["node", "bin/on-event.js"]

[[events]]
on = "pane.exited"
command = ["node", "bin/on-event.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "bin/on-event.js"]
